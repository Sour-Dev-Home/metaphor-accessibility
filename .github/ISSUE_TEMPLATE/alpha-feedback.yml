name: Alpha feedback
description: Tell us how the alpha worked for you. Plain text, no contact details needed.
labels: [needs-triage]
body:
  - type: textarea
    id: did
    attributes:
      label: What were you doing?
      description: The steps, in order. For example, opened the shop and moved down the list.
    validations:
      required: true
  - type: textarea
    id: mark
    attributes:
      label: Roughly when did you press the mark key?
      description: F8 is the mark key. Say roughly how far into the session you pressed it, for example about ten minutes in, just after the title screen. Leave it empty if you didn't press it.
  - type: textarea
    id: heard
    attributes:
      label: What you heard
      description: What the screen reader said, or that it said nothing. If the mod said nothing at all, run the installer again (it ends with the install check) and paste what the check says here.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: reader
    attributes:
      label: Your screen reader
      options:
        - NVDA
        - JAWS
        - Narrator
        - Other
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Attach report-log.txt
      description: Drag the report-log.txt file from the mod's folder into this box. The mod writes a new one each time the game starts, so attach it before you start the game again. It holds your mark key presses and the screens the mod said nothing for, but no game text. Check it holds nothing you want kept private first.
