name: Release

# Turns a `v*` tag on a commit on main into a draft GitHub Release (#310): built by CI from that commit with the recipe
# every main build uses (scripts/build-release.sh), rebuilt and compared, attested, and published with its SHA256SUMS.
# The maintainer publishes the draft. Only admins create `v*` tags (CONTRIBUTING.md, the tag ruleset of #309).
# Run it by hand on main for a dry run: it builds, attests and verifies a zip, and drafts nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time; a second tag push waits instead of racing the first one's release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Before anything is built: a tag must name a version and point at a commit on main, and a run by hand must be on
  # main itself. It runs git only, never the repository's code, and hands the build the exact commit it checked.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.check.outputs.commit }}
      name: ${{ steps.check.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # origin/main, to check the tag's commit is on it
      - name: Check the tag is a version on main
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          commit="$(git rev-parse HEAD)"
          if [ "$EVENT_NAME" = push ]; then
            if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::$GITHUB_REF isn't a version tag such as refs/tags/v1.2.3 or refs/tags/v1.2.3-beta.1"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$commit" origin/main; then
              echo "::error::Tag $GITHUB_REF_NAME points at $commit, which isn't on main"
              exit 1
            fi
            name="metaphor-accessibility-$GITHUB_REF_NAME"
          else
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Run the dry run on main, not $GITHUB_REF"
              exit 1
            fi
            name="metaphor-accessibility-$commit"
          fi
          {
            echo "commit=$commit"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing \`$name\` from commit \`$commit\` ($GITHUB_REF)" >> "$GITHUB_STEP_SUMMARY"

  # The same Windows build as CI's gate on main, from scratch: package, check the build names the commit as clean, zip,
  # rebuild in a second checkout and compare. No cache: a release restores nothing another run wrote.
  build:
    needs: [gate]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.commit }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # Publishing fetches the pinned prism.dll (ADR 0005, scripts/fetch-prism.ps1); both builds share one download.
      - name: Build, zip, rebuild and compare
        env:
          NAME: ${{ needs.gate.outputs.name }}
          PRISM_CACHE: ${{ runner.temp }}/prism-cache
        run: bash scripts/build-release.sh "$NAME" artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: artifacts/release
          if-no-files-found: error

  # Signs the zip with a build-provenance attestation, then checks it with the command players run
  # (docs/players/how-to/check-a-download.md). It runs none of our code, so the signing token never meets the build.
  attest:
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # a Sigstore signing certificate for this workflow
      attestations: write # store the attestation with the repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Check the zip against SHA256SUMS
        working-directory: release
        run: sha256sum --check --strict SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/${{ needs.gate.outputs.name }}.zip
      # A tag build's certificate records the tag as its source ref (docs/raw-sources/github-release-provenance-2026-11-18.md).
      - name: Verify it as a player would
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.gate.outputs.name }}
        run: |
          gh attestation verify "release/$NAME.zip" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "$GITHUB_REF" --deny-self-hosted-runners

  # The only job that can write: it drafts the release for a pushed tag, after the zip is signed and verified. No pull
  # request can start this workflow, and the job runs none of our code: it uploads the two files the build made.
  release:
    needs: [gate, attest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the draft release and upload its files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Check the zip against SHA256SUMS
        working-directory: release
        run: sha256sum --check --strict SHA256SUMS
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.gate.outputs.name }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="Check the zip before you install it: https://github.com/$GITHUB_REPOSITORY/blob/main/docs/players/how-to/check-a-download.md"
          gh release create "$TAG" "release/$NAME.zip" release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --notes "$notes"
          echo "Drafted release \`$TAG\` with \`$NAME.zip\` and \`SHA256SUMS\`; publish it from the Releases page." >> "$GITHUB_STEP_SUMMARY"
