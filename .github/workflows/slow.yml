# The slow suite: Stryker.NET mutation testing and a jscpd duplication report (scripts/check.sh slow). It only reports.
# It never runs on a push or pull request, so no merge waits for it (tests/scripts/test-repo-config.sh checks this).
name: Slow suite

on:
  schedule:
    # Mondays 05:17 UTC. Off the hour: GitHub delays, and may drop, scheduled runs at the start of each hour
    # (docs.github.com, "Events that trigger workflows", schedule).
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow-suite:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Mutation testing and duplication report
        run: bash scripts/check.sh slow
      # The score per file and each surviving mutant on the run's page; the full HTML reports in the artifact.
      - name: Publish the summary
        if: always()
        run: |
          if [ -f artifacts/slow/summary.md ]; then
            cat artifacts/slow/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The slow suite wrote no summary; see the log." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: slow-suite-${{ github.sha }}
          path: artifacts/slow
          if-no-files-found: warn
