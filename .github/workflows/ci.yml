name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repo-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the check command
        run: bash tests/check/test-check.sh
      - name: Check every tracked file
        env:
          # The private list reaches pushes to this repository's main only, never a pull request, so a fork's code
          # can't read it, and a fork's own main isn't required to have it.
          PII_PATTERNS: >-
            ${{ github.repository == 'Sour-Dev-Home/metaphor-refantazio' && github.event_name == 'push'
            && github.ref == 'refs/heads/main' && secrets.PII_PATTERNS || '' }}
          REQUIRE_PRIVATE_PATTERNS: >-
            ${{ github.repository == 'Sour-Dev-Home/metaphor-refantazio' && github.event_name == 'push'
            && github.ref == 'refs/heads/main' && '1' || '' }}
        run: bash scripts/check.sh full
