name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repo-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the check command
        run: bash tests/check/test-check.sh
      - name: Check every tracked file
        run: bash scripts/check.sh full
