name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repo-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the commit-message step needs the PR's commits, not just the merge result
      - name: Test the check scripts
        run: |
          bash tests/check/test-check.sh
          bash tests/scripts/test-tree-hash.sh
          bash tests/scripts/test-repo-config.sh
          bash tests/scripts/test-policy-files.sh
      - name: Check every tracked file
        env:
          # The private list reaches pushes to this repository's main only, never a pull request, so a fork's code
          # can't read it, and a fork's own main isn't required to have it.
          PII_PATTERNS: >-
            ${{ github.repository == 'Sour-Dev-Home/metaphor-refantazio' && github.event_name == 'push'
            && github.ref == 'refs/heads/main' && secrets.PII_PATTERNS || '' }}
          REQUIRE_PRIVATE_PATTERNS: >-
            ${{ github.repository == 'Sour-Dev-Home/metaphor-refantazio' && github.event_name == 'push'
            && github.ref == 'refs/heads/main' && '1' || '' }}
        run: bash scripts/check.sh rules
      # Dependabot's commit bodies carry release notes past the body limit; its PRs get the maintainer's message on
      # the squash merge.
      - name: Check the pull request's commit messages
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check.sh commits "$BASE..$HEAD"

  build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      # Private patterns run in repo-rules only, so the secret reaches one job; this job warns that they're missing.
      - name: Check, build, test and verify formatting
        run: bash scripts/check.sh full
      # Build once: package the Release build that the step above built and tested.
      - name: Package the tested build
        id: package
        run: |
          sha="$(bash scripts/package-mod.sh --no-build artifacts/mod)"
          if ! grep -aq "+$GITHUB_SHA" artifacts/mod/Metaphor.Hooks.dll ||
            grep -aq "+$GITHUB_SHA-dirty" artifacts/mod/Metaphor.Hooks.dll; then
            echo "::error::The packaged mod doesn't name commit $GITHUB_SHA as a clean build"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Packaged mod SHA-256: $sha (commit $GITHUB_SHA)"
          echo "Packaged mod SHA-256: \`$sha\` (commit \`$GITHUB_SHA\`)" >> "$GITHUB_STEP_SUMMARY"
      # Reproducible build: a fresh checkout at another path, built from scratch, must give the same bytes.
      - name: Rebuild in a second checkout and compare
        env:
          FIRST_SHA: ${{ steps.package.outputs.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/rebuild" HEAD
          second="$(bash "$RUNNER_TEMP/rebuild/scripts/package-mod.sh" "$RUNNER_TEMP/rebuild-out")"
          if [ "$second" != "$FIRST_SHA" ]; then
            echo "::error::Rebuild differs: $FIRST_SHA then $second"
            exit 1
          fi
          echo "A rebuild in a second checkout at another path matches." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-${{ github.sha }}
          path: artifacts/mod
          if-no-files-found: error

  # Runs beside build, so it gates merges without slowing the commit stage. A vulnerable package fails the job; a new
  # high or critical CodeQL security alert blocks the merge through the ruleset's code-scanning rule.
  security:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload CodeQL results to code scanning
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      # The C# code and the workflows themselves. build-mode none reads the source without building it.
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp, actions
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      - name: Fail on vulnerable packages, transitive ones included
        run: |
          dotnet restore Metaphor.sln
          report="$(dotnet list Metaphor.sln package --vulnerable --include-transitive --format json)"
          echo "$report"
          # A clean project lists only its path; one with vulnerable packages lists them under "frameworks", and
          # errors land under "problems". Either one fails, so a format change fails closed.
          if grep -qE '"(frameworks|problems)"' <<<"$report"; then
            echo "::error::A package has a known vulnerability, or the audit failed; see the report above"
            exit 1
          fi
