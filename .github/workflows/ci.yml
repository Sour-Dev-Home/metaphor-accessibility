name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each PR merged with the ones ahead of it; its required checks come from this run.
  merge_group:

permissions:
  contents: read

jobs:
  repo-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # PII_PATTERNS lives in the main-push environment, which only main may use (#309), so no branch's run can read it.
    # Every other run uses no environment.
    environment: >-
      ${{ github.repository == 'Sour-Dev-Home/metaphor-accessibility' && github.event_name == 'push'
      && github.ref == 'refs/heads/main' && 'main-push' || '' }}
    permissions:
      contents: read
      pull-requests: read # the commits stage reads the PR timeline (#127)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the commit-message step needs the PR's commits, not just the merge result
      # Dependabot's commit bodies carry release notes past the body limit; its PRs get the maintainer's message on
      # the squash merge. Review trailers: CONTRIBUTING.md#security-review-and-deny-rules (fetch-depth 0 brings
      # origin/main, which the clean-merge rule compares with).
      # This step stays first: a step running the PR's code could write $GITHUB_ENV or $GITHUB_PATH (BASH_ENV, a fake
      # git or gh) and so control every step after it.
      - name: Check the pull request's commit messages and review trailers
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # A PR not by the maintainer that changes files outside docs/ needs the security-reviewed label, added by
          # an admin (#127, #309); collaborators and members included. The read-only token reads the PR timeline and
          # repository permissions through `gh api`.
          PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
          GH_TOKEN: ${{ github.token }}
        # A PR not by the maintainer is judged by the base branch's copy of the gate, so it can't edit the check that
        # judges it. The maintainer's PR (OWNER, or an admin: in an organization the maintainer shows as MEMBER) runs
        # its own copy, so changes to the gate test themselves.
        run: |
          gate="$RUNNER_TEMP/base-scripts"
          if [ "$PR_AUTHOR_ASSOCIATION" = OWNER ]; then
            gate=scripts
          else
            permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$PR_AUTHOR/permission" --jq .permission)" ||
              exit 1
            [ "$permission" != admin ] || gate=scripts
          fi
          if [ "$gate" != scripts ]; then
            mkdir -p "$gate"
            for script in check.sh security-stamp.sh stage-timing.sh; do
              git show "$BASE:scripts/$script" > "$gate/$script" || exit 1
            done
          fi
          bash "$gate/check.sh" commits "$BASE..$HEAD"
      - name: Install the docs tools
        run: bash scripts/install-docs-tools.sh
      - name: Test the check scripts
        run: bash scripts/run-check-suites.sh
      - name: Check every tracked file
        env:
          # The private list reaches pushes to this repository's main only, never a pull request, so a fork's code
          # can't read it, and a fork's own main isn't required to have it. It's a secret of the main-push
          # environment, so a branch run that edits this expression still can't read it.
          PII_PATTERNS: >-
            ${{ github.repository == 'Sour-Dev-Home/metaphor-accessibility' && github.event_name == 'push'
            && github.ref == 'refs/heads/main' && secrets.PII_PATTERNS || '' }}
          REQUIRE_PRIVATE_PATTERNS: >-
            ${{ github.repository == 'Sour-Dev-Home/metaphor-accessibility' && github.event_name == 'push'
            && github.ref == 'refs/heads/main' && '1' || '' }}
        run: bash scripts/check.sh rules
      - name: Check the docs
        env:
          REQUIRE_DOCS_TOOLS: "1"
        run: bash scripts/check.sh docs
      # The description reaches the script through a file, never through the shell's command line.
      - name: Check the pull request's description
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          REQUIRE_DOCS_TOOLS: "1"
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          bash scripts/check.sh pr-body "$RUNNER_TEMP/pr-body.md"

  # Two paths under one check name (#100). On a pull request: the .NET work on Linux, which is fast, skipped when only
  # docs changed. In the merge queue and on main: the full Windows gate, where the release package is built and rebuilt;
  # players' builds stay Windows-built until the same bytes from both systems are shown.
  build:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'windows-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the change check diffs the PR against its base
      # A skipped job still reports success, so the required check never goes missing. Merge-queue and main runs skip nothing.
      - name: Check what changed
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-changes.sh code "$BASE" "$HEAD"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      # Private patterns run in repo-rules only, so the secret reaches one job; this job warns that they're missing.
      # The Pester script tests run in the parallel `scripts` job.
      - name: Check, build, test and verify formatting
        if: steps.changes.outputs.run == 'true'
        env:
          SKIP_SCRIPT_TESTS: "1"
        run: bash scripts/check.sh full
      # Build once: package the Release build that the step above built and tested.
      # Publishing fetches the pinned prism.dll (ADR 0005, scripts/fetch-prism.ps1); both checkouts share one download.
      - name: Package the tested build
        id: package
        if: github.event_name != 'pull_request'
        env:
          PRISM_CACHE: ${{ runner.temp }}/prism-cache
        run: |
          sha="$(bash scripts/package-mod.sh --no-build artifacts/mod)"
          if ! grep -aq "+$GITHUB_SHA" artifacts/mod/Metaphor.Hooks.dll ||
            grep -aq "+$GITHUB_SHA-dirty" artifacts/mod/Metaphor.Hooks.dll; then
            echo "::error::The packaged mod doesn't name commit $GITHUB_SHA as a clean build"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Packaged mod SHA-256: $sha (commit $GITHUB_SHA)"
          echo "Packaged mod SHA-256: \`$sha\` (commit \`$GITHUB_SHA\`)" >> "$GITHUB_STEP_SUMMARY"
      # Reproducible build: a fresh checkout at another path, built from scratch, must give the same bytes.
      - name: Rebuild in a second checkout and compare
        if: github.event_name != 'pull_request'
        env:
          FIRST_SHA: ${{ steps.package.outputs.sha }}
          PRISM_CACHE: ${{ runner.temp }}/prism-cache
        run: |
          git worktree add --detach "$RUNNER_TEMP/rebuild" HEAD
          second="$(bash "$RUNNER_TEMP/rebuild/scripts/package-mod.sh" "$RUNNER_TEMP/rebuild-out")"
          if [ "$second" != "$FIRST_SHA" ]; then
            echo "::error::Rebuild differs: $FIRST_SHA then $second"
            exit 1
          fi
          echo "A rebuild in a second checkout at another path matches." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: mod-${{ github.sha }}
          path: artifacts/mod
          if-no-files-found: error

  # The smoke-test and deploy scripts' Pester tests, in parallel with build. They need Windows (PowerShell scripts against
  # the stand-in game) and run when a change touches scripts, tests/smoke, the stand-in game or the workflows. One job
  # per test file (#314: the files ran one after another in a single job, over 5 of its 6 minutes); each job builds the
  # stand-in game on its own runner, so the files can't collide on its obj folder.
  pester:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        file: [capture, deploy-dev, fetch-prism, GameLocator, listen, onboard, signature-spike, smoke-test]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check what changed
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-changes.sh scripts "$BASE" "$HEAD"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Run the Pester tests
        if: steps.changes.outputs.run == 'true'
        env:
          TEST_FILE: tests/smoke/${{ matrix.file }}.Tests.ps1
        run: |
          pwsh -NoProfile -Command 'Import-Module Pester -MinimumVersion 5.0; $r = Invoke-Pester $env:TEST_FILE -PassThru -Output Normal; exit $r.FailedCount'

  # The required check named `scripts` (the ruleset asks for it by name): it passes when every Pester job passed or was
  # skipped, and fails when any failed or was cancelled. Add a test file under tests/smoke and to the matrix above;
  # tests/scripts/test-ci-matrix.sh fails when the two disagree.
  scripts:
    needs: [pester]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every Pester job passed
        env:
          RESULT: ${{ needs.pester.result }}
        run: |
          echo "pester jobs: $RESULT"
          [ "$RESULT" = success ] || [ "$RESULT" = skipped ]

  # Runs beside build, so it gates merges without slowing the commit stage. A vulnerable package fails the job; a new
  # high or critical CodeQL security alert blocks the merge through the ruleset's code-scanning rule. It runs on every
  # pull request: code scanning must report on each one.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload CodeQL results to code scanning
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      # The C# code and the workflows themselves. build-mode none reads the source without building it.
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp, actions
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      - name: Fail on vulnerable packages, transitive ones included
        run: |
          dotnet restore Metaphor.sln
          report="$(dotnet list Metaphor.sln package --vulnerable --include-transitive --format json)"
          echo "$report"
          # A clean project lists only its path; one with vulnerable packages lists them under "frameworks", and
          # errors land under "problems". Either one fails, so a format change fails closed.
          if grep -qE '"(frameworks|problems)"' <<<"$report"; then
            echo "::error::A package has a known vulnerability, or the audit failed; see the report above"
            exit 1
          fi

  # Stage 2's time against its 5-minute budget (issue #1): each job's duration on the run's summary page, and a warning
  # annotation when the stage runs over. It only reports, so it runs after the others whatever their result.
  timing:
    needs: [repo-rules, build, pester, scripts, security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read # read this run's job times
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/stage-timing.sh
          sparse-checkout-cone-mode: false
      - name: Time stage 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.status == "completed" and .conclusion != "skipped")
              | [.name, .started_at, .completed_at] | @tsv' > "$RUNNER_TEMP/jobs.tsv"
          bash scripts/stage-timing.sh jobs "stage 2 (CI)" 300 "$RUNNER_TEMP/jobs.tsv"
