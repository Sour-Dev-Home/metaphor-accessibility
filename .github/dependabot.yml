# Weekly version updates for the pinned NuGet packages and Actions commits. Security updates are on in the repo
# settings and arrive as soon as an advisory lands. One grouped PR per ecosystem keeps the review load small.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      nuget:
        patterns: ["*"]

  # The docs tools' lockfile. lychee and Vale are pinned in scripts/install-docs-tools.sh, which Dependabot can't read.
  - package-ecosystem: "npm"
    directory: "/tools/docs"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      docs-tools:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]
