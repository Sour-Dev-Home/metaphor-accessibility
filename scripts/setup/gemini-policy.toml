# The deny rules of .claude/settings.json for Gemini CLI (#1031). scripts/setup/gemini.ps1 copies this file into the
# user's Gemini policies folder, because Gemini CLI 0.71.1 doesn't load a project's own policies (upstream
# google-gemini/gemini-cli#18186). Checked against the installed 0.71.1 bundle: a commandRegex is tested against the
# arguments as JSON, right after `"command":"`, so each one starts with `.*`; an argsPattern is tested anywhere in the
# arguments' JSON. Tests: tests/pester/gemini.Tests.ps1.

# Never force-push: --force, --force-with-lease, -f, or a +refspec.
[[rule]]
toolName = "run_shell_command"
commandRegex = '.*\bgit\b.*\bpush\b.*(--force|\s-[a-zA-Z]*f|\s\+)'
decision = "deny"
priority = 900
denyMessage = "Force-pushing is never allowed in this repository (AGENTS.md)."

# Never skip the git hooks.
[[rule]]
toolName = "run_shell_command"
commandRegex = '.*\bgit\b.*(--no-verify|\bcommit\b[^&|;]*\s-[a-zA-Z]*n)'
decision = "deny"
priority = 900
denyMessage = "Skipping the git hooks is never allowed in this repository (AGENTS.md)."

# Never set SECURITY_REVIEW_SKIP.
[[rule]]
toolName = "run_shell_command"
commandRegex = '.*SECURITY_REVIEW_SKIP'
decision = "deny"
priority = 900
denyMessage = "SECURITY_REVIEW_SKIP is never set (AGENTS.md)."

# The private PII patterns stay private: no printing them, by the shell's readers or the file tools. `grep -F -f` over
# them stays allowed, as in .claude/settings.json.
[[rule]]
toolName = "run_shell_command"
commandRegex = '.*\b(cat|type|Get-Content|gc|head|tail|less|more)\b.*pii-patterns\.txt'
decision = "deny"
priority = 900
denyMessage = "The private PII patterns file is not read by agents."

[[rule]]
toolName = "read_file"
argsPattern = 'pii-patterns\.txt'
decision = "deny"
priority = 900

[[rule]]
toolName = "read_many_files"
argsPattern = 'pii-patterns\.txt'
decision = "deny"
priority = 900

[[rule]]
toolName = "grep_search"
argsPattern = 'pii-patterns\.txt'
decision = "deny"
priority = 900

# The patterns file is git-ignored and sits in .claude/, so a glob there, or a search past the git-ignore, could reach
# it without naming it. Argument names checked in the 0.71.1 bundle (respect_git_ignore, no_ignore).
[[rule]]
toolName = "read_many_files"
argsPattern = '\.claude[\\/]+[^"]*\*|"respect_git_ignore":false'
decision = "deny"
priority = 900

[[rule]]
toolName = "grep_search"
argsPattern = '\.claude[\\/]+[^"]*\*|"no_ignore":true|"respect_git_ignore":false'
decision = "deny"
priority = 900

[[rule]]
toolName = "glob"
argsPattern = '"respect_git_ignore":false'
decision = "deny"
priority = 900
